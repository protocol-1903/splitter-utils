[splitter-utils-ui]
frame=Splitter Settings
checkbox-eil=Exchange input lines
checkbox-eol=Exchange output lines

[mod-setting-name]
su-eil-default=Splitters exchange input lines by default
su-eol-default=Splitters exchange output lines by default
su-show-all-splitters=Show all splitter in selection UIs

[mod-setting-description]
su-show-all-splitters=Shows all splitter entities in selection UIs like deconstruction and upgrade planners. This also allows you to use a generic upgrade planners on splitter.